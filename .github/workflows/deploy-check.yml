name: Deployment Readiness Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-build-verify:
    name: Verify Production Container Builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: forgeai-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.forgeai.dev
          push: false
          tags: forgeai-frontend:test

  production-config-verify:
    name: Verify Production Configuration Constraints
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          pip install -e .
          pip install pytest pytest-asyncio

      - name: Run Production Security Config Tests
        working-directory: ./backend
        run: |
          pytest tests/unit/test_config.py
