services:
  # --------------------------------------------------------------------------
  # 1. FastAPI REST API + Embedded ARQ Worker (100% Free Plan)
  # --------------------------------------------------------------------------
  - type: web
    name: forgeai-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install greenlet && pip install ."
    startCommand: "sh start.sh"
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: forgeai-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: forgeai-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: GITHUB_WEBHOOK_SECRET
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: '["https://forgeai-frontend.onrender.com"]'
      - key: FRONTEND_URL
        value: https://forgeai-frontend.onrender.com
      - key: AGENT_DEFAULT_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # --------------------------------------------------------------------------
  # 2. Next.js 15 Frontend (100% Free Plan)
  # --------------------------------------------------------------------------
  - type: web
    name: forgeai-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    startCommand: "npm run start"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: NEXT_PUBLIC_API_URL
        value: https://forgeai-api.onrender.com

  # --------------------------------------------------------------------------
  # 3. Redis Key-Value Store (100% Free Plan)
  # --------------------------------------------------------------------------
  - type: keyvalue
    name: forgeai-redis
    region: oregon
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

# ----------------------------------------------------------------------------
# 4. PostgreSQL Database with pgvector (100% Free Plan)
# ----------------------------------------------------------------------------
databases:
  - name: forgeai-postgres
    region: oregon
    plan: free
    databaseName: forgeai
    user: forgeai
    postgresMajorVersion: 16
