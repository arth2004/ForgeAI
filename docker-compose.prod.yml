name: forgeai-prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: forgeai-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-forgeai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-forgeai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forgeai-prod-network

  redis:
    image: redis:7-alpine
    container_name: forgeai-prod-redis
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forgeai-prod-network

  # Isolated migration runner ensures schema is fully applied before the API boots
  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forgeai-prod-migration
    restart: "no"
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - forgeai-prod-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forgeai-prod-api
    restart: always
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
      FRONTEND_URL: ${FRONTEND_URL}
      AGENT_DEFAULT_PROVIDER: ${AGENT_DEFAULT_PROVIDER:-groq}
    ports:
      - "${API_PORT:-8000}:8000"
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers $${WEB_CONCURRENCY:-4}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - forgeai-prod-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forgeai-prod-worker
    restart: always
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
    command: python -m arq app.workers.main.WorkerSettings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - forgeai-prod-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: forgeai-prod-frontend
    restart: always
    environment:
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - forgeai-prod-network

volumes:
  pgdata:
  redisdata:

networks:
  forgeai-prod-network:
    driver: bridge
